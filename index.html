<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air-Gapped Gesture Vault</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #121212;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 30px 30px;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.4;
            z-index: 10;
        }

        .layout-container {
            display: flex;
            gap: 2rem;
            z-index: 2;
            align-items: flex-start;
        }

        .container {
            text-align: center;
            background: rgba(18, 18, 18, 0.85);
            padding: 2rem;
            border: 2px solid #333;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
            width: 680px;
        }

        .hints-panel {
            background: rgba(18, 18, 18, 0.85);
            padding: 1.5rem;
            border: 2px dashed #555;
            border-radius: 12px;
            width: 250px;
            color: #ccc;
        }

        .hints-panel h3 { margin-top: 0; color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .hints-panel ul { list-style-type: none; padding: 0; line-height: 1.8; font-size: 0.95rem; }
        .hints-panel li span { color: #baffc9; font-weight: bold; }

        .video-wrapper {
            position: relative;
            display: inline-block;
            border: 4px solid white;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        video, canvas {
            display: block;
            width: 640px;
            height: 480px;
            transform: scaleX(-1);
        }

        #output_canvas {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }

        #progress-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-ring {
            position: absolute;
            transform: rotate(-90deg);
        }
        
        .progress-ring__circle {
            transition: stroke-dashoffset 0.1s linear;
            stroke: #baffc9;
            stroke-dasharray: 251.2; 
            stroke-dashoffset: 0;
            stroke-linecap: round;
        }

        #progress-emoji {
            font-size: 3rem;
            z-index: 5;
            opacity: 0.5;
            transition: transform 0.2s, opacity 0.2s;
        }

        .locked-in #progress-emoji {
            transform: scale(1.3);
            opacity: 1;
        }

        .pin-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .pin-dot {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: #222;
            transition: all 0.3s ease;
        }

        .pin-dot.filled {
            border-color: #baffc9;
            background: rgba(186, 255, 201, 0.1);
        }

        #status-bar {
            font-size: 1.2rem;
            color: #ffb3ba;
            letter-spacing: 1px;
            height: 25px;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .success-pop { animation: pop 0.4s ease; border-color: #baffc9 !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .error-shake { animation: shake 0.3s ease; border-color: #ffb3ba !important; }

        #success-page {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #121212;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
            color: #baffc9;
            text-align: center;
        }

        #success-page h1 {
            font-size: 4rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="layout-container" id="main-layout">
        <div class="container">
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
                
                <div id="progress-container">
                    <svg class="progress-ring" width="100" height="100">
                        <circle class="progress-ring__circle" stroke-width="8" fill="transparent" r="40" cx="50" cy="50"/>
                    </svg>
                    <div id="progress-emoji"></div>
                </div>
            </div>

            <div class="pin-container">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>

            <div id="status-bar">Awaiting Input</div>
        </div>

        <div class="hints-panel">
            <h3>System Guide</h3>
            <ul>
                <li><span>Victory</span> ✌️</li>
                <li><span>Closed_Fist</span> ✊</li>
                <li><span>Open_Palm</span> 🖐️</li>
                <li><span>Thumb_Up</span> 👍</li>
                <li><span>Thumb_Down</span> 👎</li>
                <li><span>Pointing_Up</span> ☝️</li>
                <li><span>ILoveYou</span> 🤟</li>
            </ul>
        </div>
    </div>

    <div id="success-page">
        <h1>🔓 You Found It!</h1>
        <p style="color: #ccc; font-size: 1.2rem;">The Air-Gapped Vault is open.</p>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
